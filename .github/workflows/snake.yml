name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"  # Corre todo dia à meia-noite
  workflow_dispatch:  # Permite rodar manualmente

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: Kuroshi7  # Seu username
          outputs: |
            dist/github-contribution-grid-snake.svg

      - name: Set up Git configuration
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Check out branch
        run: |
          git fetch origin
          git checkout -B output origin/output || git checkout --orphan output  # Verifica e faz o checkout da branch ou cria uma nova

      - name: Commit and push
        run: |
          git add dist/github-contribution-grid-snake.svg
          git commit -m "generate contribution snake"
          git push origin output  # Push para a branch output
